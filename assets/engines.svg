<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">The two engines</title>
  <desc id="desc">Both engines implement the Engine trait. The Claude engine drives one long-lived claude CLI process per agent, over stream-json, with Quartermaster's tools offered as an MCP server; it runs Claude models on your Claude subscription, whose login stays with claude. The provider engine runs its own agent loop with its own file and shell tools, and talks to providers through four wire adapters: OpenAI Responses for ChatGPT, OpenAI and Grok; Anthropic Messages for an Anthropic API key; Chat Completions for Copilot, Kimi, OpenRouter and custom endpoints; and Gemini for a Gemini API key. Its logins and keys live in auth.json and are refreshed automatically.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d1d9e0; }
    .t { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
    .s { fill: #59636e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 400; }
    .l { fill: #59636e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t.m { font-size: 14px; }
    .n { fill: #f6f8fa; stroke: #d1d9e0; }
    .blue { fill: #ddf4ff; stroke: #0969da; }
    .green { fill: #dafbe1; stroke: #1a7f37; }
    .orange { fill: #fff1e5; stroke: #bc4c00; }
    .purple { fill: #fbefff; stroke: #8250df; }
    .box { stroke-width: 1.5; }
    .grp { fill: none; stroke: #d1d9e0; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .ln { fill: none; stroke: #818b98; stroke-width: 1.5; }
    .ah { fill: #818b98; }
    .gap { fill: none; stroke: #ffffff; stroke-width: 8; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #3d444d; }
      .t { fill: #f0f6fc; }
      .s, .l { fill: #9198a1; }
      .n { fill: #151b23; stroke: #3d444d; }
      .blue { fill: #0f2541; stroke: #4493f8; }
      .green { fill: #0f2a1b; stroke: #3fb950; }
      .orange { fill: #2f1b0c; stroke: #db6d28; }
      .purple { fill: #251a3d; stroke: #ab7df8; }
      .grp { stroke: #3d444d; }
      .ln { stroke: #7d8590; }
      .ah { fill: #7d8590; }
      .gap { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="ah" d="M0,1 L9,5 L0,9 Z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="559" rx="12"/>

  <!-- the trait -->
  <rect class="box n" x="32" y="32" width="896" height="52" rx="8"/>
  <text class="t" x="480" y="54" text-anchor="middle"><tspan class="m">Engine</tspan> trait</text>
  <text class="s" x="480" y="72" text-anchor="middle">open or resume a session · send turns · interrupt · tool calls come back to the core</text>

  <path class="ln" d="M480,84 V104"/>
  <path class="ln" d="M242,104 H718"/>
  <path class="ln" d="M242,104 V124" marker-end="url(#a)"/>
  <path class="ln" d="M718,104 V124" marker-end="url(#a)"/>

  <!-- Claude engine -->
  <rect class="box orange" x="32" y="124" width="420" height="52" rx="8"/>
  <text class="t" x="242" y="146" text-anchor="middle">Claude engine</text>
  <text class="s m" x="242" y="164" text-anchor="middle">qm-engine-claude</text>

  <path class="ln" d="M242,176 V216" marker-end="url(#a)"/>
  <text class="l" x="254" y="200">stream-json over stdio</text>

  <rect class="box n" x="32" y="216" width="420" height="76" rx="8"/>
  <text class="t" x="242" y="240" text-anchor="middle"><tspan class="m">claude</tspan> CLI</text>
  <text class="s" x="242" y="260" text-anchor="middle">one long-lived process per agent</text>
  <text class="s" x="242" y="278" text-anchor="middle">our tools offered as an MCP server</text>

  <path class="ln" d="M242,292 V332" marker-end="url(#a)"/>

  <rect class="box n" x="32" y="332" width="420" height="196" rx="8"/>
  <text class="t" x="242" y="398" text-anchor="middle">Claude models</text>
  <text class="s" x="242" y="418" text-anchor="middle">on your Claude subscription</text>
  <text class="s m" x="242" y="454" text-anchor="middle">claude auth login</text>
  <text class="s" x="242" y="474" text-anchor="middle">the login stays with <tspan class="m">claude</tspan></text>

  <!-- provider engine -->
  <rect class="box purple" x="508" y="124" width="420" height="52" rx="8"/>
  <text class="t" x="718" y="146" text-anchor="middle">Provider engine</text>
  <text class="s m" x="718" y="164" text-anchor="middle">qm-providers</text>

  <path class="ln" d="M718,176 V216" marker-end="url(#a)"/>

  <rect class="box n" x="508" y="216" width="420" height="76" rx="8"/>
  <text class="t" x="718" y="240" text-anchor="middle">Agent loop</text>
  <text class="s" x="718" y="260" text-anchor="middle">model → tools → results → repeat</text>
  <text class="s m" x="718" y="278" text-anchor="middle">read write edit grep find ls bash</text>

  <path class="ln" d="M718,292 V332" marker-end="url(#a)"/>
  <text class="l" x="730" y="316">HTTPS</text>

  <rect class="box n" x="508" y="332" width="420" height="196" rx="8"/>
  <text class="t" x="718" y="356" text-anchor="middle">Wire adapters → accounts</text>

  <rect class="box purple" x="524" y="370" width="388" height="26" rx="6"/>
  <text class="s" x="536" y="387"><tspan class="t" style="font-size:12.5px">OpenAI Responses</tspan></text>
  <text class="s" x="680" y="387">ChatGPT · OpenAI · Grok (xAI)</text>
  <rect class="box purple" x="524" y="402" width="388" height="26" rx="6"/>
  <text class="s" x="536" y="419"><tspan class="t" style="font-size:12.5px">Anthropic Messages</tspan></text>
  <text class="s" x="680" y="419">Anthropic API key</text>
  <rect class="box purple" x="524" y="434" width="388" height="26" rx="6"/>
  <text class="s" x="536" y="451"><tspan class="t" style="font-size:12.5px">Chat Completions</tspan></text>
  <text class="s" x="680" y="451">Copilot · Kimi · OpenRouter · custom</text>
  <rect class="box purple" x="524" y="466" width="388" height="26" rx="6"/>
  <text class="s" x="536" y="483"><tspan class="t" style="font-size:12.5px">Gemini</tspan></text>
  <text class="s" x="680" y="483">Gemini API key</text>

  <text class="l" x="718" y="514" text-anchor="middle">logins and keys in <tspan class="m">auth.json</tspan>, refreshed automatically</text>
</svg>
