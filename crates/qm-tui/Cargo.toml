[package]
name = "qm-tui"
description = "The terminal UI: the Bridge, settings, decisions, worker sessions, the setup check."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The UI depends on the core's API messages only, never on qm-core itself.
qm-types.workspace = true
crossterm.workspace = true
ratatui.workspace = true
jiff.workspace = true
unicode-width.workspace = true
# Suspending with Ctrl+Z (SIGTSTP), and remembering column widths (tui.toml).
nix = { workspace = true, features = ["signal"] }
serde.workspace = true
toml.workspace = true
pulldown-cmark.workspace = true
syntect.workspace = true
# The setup check's embedded terminal pane.
portable-pty.workspace = true
vt100.workspace = true

[lints]
workspace = true
