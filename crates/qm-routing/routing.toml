# The rule table: the first matching rule wins. It reads declared facts only, never task text. "Low
# is only for lookups, medium only when the work builds on finished thinking, and everything else is
# high." The app loads and validates this table at startup and rejects one that maps anything to
# premium, lets `unclear` route anywhere but high, or leaves some facts matching no rule.
#
# `builds_on` is a fact the app checks, not words the Quartermaster writes: `finished_plan` (a
# `plan` task that reported an answer) or `confirmed_diagnosis` (a reproduction that reported
# `reproduced: yes`, or a `research` task whose report is marked as a diagnosis).
rules = [
  { kind = "lookup",                                   tier = "low" },
  { kind = "build", builds_on = "finished_plan",       tier = "medium" },
  { kind = "fix",   builds_on = "confirmed_diagnosis", tier = "medium" },
  { kind = "*",                                        tier = "high" },   # everything else
]
