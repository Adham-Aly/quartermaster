[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax). Assets are named by triple, so
# adding a platform is adding its triple here (Windows also wants "powershell" in installers),
# then `dist generate` and, if dist's default runner is retired, a github-custom-runners entry.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Build only the quartermaster package (like `cargo xtask install`), not the whole workspace: xtask stays
# out of the build.
precise-builds = true

# Pinned GitHub runner images (checked October 2026). dist's defaults would be macos-14 (retired
# 2 November 2026), macos-15-intel (the last Intel image) and ubuntu-22.04 (being deprecated).
# Both macOS targets build on one Apple Silicon runner; x86_64 is cross-compiled there.
[dist.github-custom-runners]
global = "ubuntu-24.04"
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15"
